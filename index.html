<style>
:root{--bg:#0f3a2d;--bg2:#154d3b;--card:#1b5a45;--card2:#216b52;--ink:#f4f1e4;--mute:#a9cdbb;--leaf:#9be07a;--gold:#ffd45e;--red:#ff8a80;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1f7a5a 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.app{max-width:560px;margin:0 auto;padding:14px 16px 96px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
.coin{background:rgba(0,0,0,.25);padding:6px 14px;border-radius:999px;font-weight:700;color:var(--gold);display:flex;gap:6px;align-items:center}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,38,30,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;padding:10px 4px 12px;color:var(--mute);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--leaf)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.muted{color:var(--mute);font-size:13px}
/* focus */
.stage{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:10px auto 0}
.stage svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.12);stroke-width:5}
#ringP{fill:none;stroke:var(--leaf);stroke-width:5;stroke-linecap:round;stroke-dasharray:578;stroke-dashoffset:578;transition:stroke-dashoffset 1s linear}
.treebox{position:absolute;inset:12% 12% 8%}
.treebox svg{width:100%;height:100%}
.time{font-size:54px;font-weight:800;text-align:center;margin:6px 0 0;font-variant-numeric:tabular-nums;letter-spacing:1px}
.sub{text-align:center;color:var(--mute);min-height:22px;font-size:14px}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:4px;margin:12px auto;max-width:300px}
.seg button{flex:1;background:none;padding:7px 8px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--leaf);color:#12351f}
input[type=range]{width:100%;accent-color:var(--leaf);margin:6px 0}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{background:rgba(0,0,0,.25);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.big{display:block;width:min(100%,300px);margin:14px auto 0;background:var(--leaf);color:#12351f;font-weight:800;font-size:19px;padding:14px;border-radius:999px;box-shadow:0 6px 0 #5da545;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #5da545}
.big.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;font-size:15px;padding:10px;margin-top:12px}
.warn{background:rgba(255,138,128,.14);color:#ffd2cd;border-radius:14px;padding:10px 14px;font-size:13px;text-align:center;margin:12px 0 0}
/* forest */
.grass{background:linear-gradient(#2a8a6a22,#1d5b45);border-radius:20px;padding:14px;min-height:200px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--s,62px),1fr));gap:6px}
.t{background:none;padding:0;position:relative;text-align:center}
.t svg{width:100%;height:auto;display:block}
.t i{position:absolute;bottom:2px;left:50%;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);border:1.5px solid rgba(0,0,0,.3)}
.pager{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.pager button{background:rgba(0,0,0,.25);width:38px;height:38px;border-radius:50%;font-size:18px}
.pager button:disabled{opacity:.3}
.pager b{font-size:15px}
.empty{text-align:center;color:var(--mute);padding:36px 10px;font-size:14px}
.detail{min-height:22px;text-align:center;font-size:13px;color:var(--mute);margin-top:10px}
/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:rgba(0,0,0,.2);border-radius:16px;padding:12px;text-align:center}
.tile b{display:block;font-size:24px;font-weight:800}
.tile span{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute)}
.bar div{width:100%;background:var(--leaf);border-radius:8px 8px 3px 3px;min-height:3px}
.bar em{font-style:normal;color:var(--ink);font-size:11px;min-height:14px}
.hrow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.hrow .n{width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .b{flex:1;height:12px;background:rgba(0,0,0,.25);border-radius:6px;overflow:hidden}
.hrow .b div{height:100%;border-radius:6px}
.hrow .v{width:62px;text-align:left;color:var(--mute);font-size:12px}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.a{background:rgba(0,0,0,.2);border-radius:14px;padding:10px;font-size:13px;opacity:.45}
.a.on{opacity:1;background:rgba(155,224,122,.15)}
.a b{display:block}
/* shop */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sp{background:var(--card2);border-radius:18px;padding:10px;text-align:center;border:2px solid transparent}
.sp.sel{border-color:var(--leaf)}
.sp svg{width:100%;height:110px}
.sp b{display:block;margin:2px 0 8px}
.sp button{width:100%;padding:8px;border-radius:999px;font-weight:700;background:var(--leaf);color:#12351f;font-size:14px}
.sp button.buy{background:var(--gold)}
.sp button.no{background:rgba(0,0,0,.3);color:var(--mute)}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on{display:flex}
#sheetBody{background:#143f31;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px 28px;max-height:86vh;overflow:auto;border:1px solid var(--line)}
#sheet.center{align-items:center}
#sheet.center #sheetBody{border-radius:24px;margin:16px;text-align:center}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(0,0,0,.2);margin-bottom:8px;width:100%;text-align:right;font-weight:600}
.row.sel{outline:2px solid var(--leaf)}
.row .x{margin-right:auto;background:none;color:var(--red);font-size:18px}
input[type=text]{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;margin:8px 0}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:#fff}
.banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94vw,520px);background:#fff;color:#12351f;border-radius:20px;padding:14px 16px 12px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.45);border-right:6px solid #5da545}
.banner b{display:block;font-size:17px;margin-bottom:4px}
.banner p{margin:4px 0;font-size:14px;line-height:1.7}
.banner .tip{color:#2f6a3a;background:#eef8e8;border-radius:10px;padding:6px 10px}
.banner small{color:#5a6b5f}
.banner .bx{position:absolute;left:10px;top:8px;background:none;color:#12351f;font-size:18px}
.yname{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:none;background:radial-gradient(circle,rgba(10,38,30,.82),rgba(10,38,30,.55));animation:ybg .65s ease both}
.yname div{text-align:center;color:#fff;animation:yin .65s cubic-bezier(.2,.9,.3,1.2) both}
.yname small{display:block;font-size:14px;color:var(--leaf);letter-spacing:1px;margin-bottom:6px}
.yname b{font-size:clamp(30px,9vw,52px);font-weight:800;text-shadow:0 0 24px rgba(155,224,122,.6)}
@keyframes yin{0%{opacity:0;transform:translateY(24px) scale(.85)}30%{opacity:1;transform:translateY(0) scale(1.06)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-8px) scale(1.02)}}
@keyframes ybg{0%{opacity:0}25%{opacity:1}85%{opacity:1}100%{opacity:0}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#12351f;padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:14px;max-width:90vw;text-align:center}
select{background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit}
.setrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:10px;font-size:14px}
.sm{background:rgba(255,255,255,.1);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
.sm.red{background:rgba(255,138,128,.2);color:#ffd2cd}
.big-t{width:150px;margin:0 auto}
@keyframes tpop{0%{transform:translate(100px,172px) scale(.55) translate(-100px,-172px);opacity:0}60%{transform:translate(100px,172px) scale(1.07) translate(-100px,-172px);opacity:1}100%{transform:translate(100px,172px) scale(1) translate(-100px,-172px);opacity:1}}
@keyframes tsway{0%,100%{transform:translate(100px,172px) rotate(-1.3deg) translate(-100px,-172px)}50%{transform:translate(100px,172px) rotate(1.3deg) translate(-100px,-172px)}}
.tsw{transform-origin:0 0;animation:tpop .7s cubic-bezier(.2,.9,.3,1.2) both}
.tsy{transform-origin:0 0;animation:tsway 5s ease-in-out .7s infinite}
@media (prefers-reduced-motion:reduce){.tsw,.tsy{animation:none}.tg{transition:none!important}}
.big:disabled{opacity:.6;box-shadow:none;transform:none;cursor:default}
.big-t svg{width:100%}
/* زرار ريّح */
.chip.rih{background:linear-gradient(135deg,#ffd45e,#ff9d5c);color:#4a2a00;font-weight:800;box-shadow:0 4px 0 #c97a2b;animation:rwob 2.6s ease-in-out infinite;transition:transform .08s,box-shadow .08s}
.chip.rih:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #c97a2b;animation:none}
@keyframes rwob{0%,34%,100%{transform:rotate(0) scale(1)}6%{transform:rotate(-7deg) scale(1.06)}12%{transform:rotate(7deg) scale(1.06)}18%{transform:rotate(-5deg)}24%{transform:rotate(4deg)}30%{transform:rotate(-2deg)}}
.rihint{text-align:center;color:var(--mute);font-size:12.5px;margin:-2px 0 10px}
@media (prefers-reduced-motion:reduce){.chip.rih{animation:none}}
/* login gate */
#gate{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;padding:24px;overflow:hidden;background:radial-gradient(900px 520px at 50% 16%,#25906a 0%,#154d3b 45%,#0f3a2d 78%)}
#gate.on{display:flex;animation:gfade .5s ease both}
#gate.out{animation:gout .6s ease both;pointer-events:none}
@keyframes gfade{from{opacity:0}to{opacity:1}}
@keyframes gout{to{opacity:0;transform:scale(1.07)}}
.gleaves{position:absolute;inset:0;pointer-events:none}
.gleaves i{position:absolute;top:-34px;font-style:normal;opacity:.5;animation:gfall linear infinite}
@keyframes gfall{0%{transform:translate(0,-30px) rotate(0)}50%{transform:translate(26px,55vh) rotate(180deg)}100%{transform:translate(-14px,112vh) rotate(360deg)}}
.gwrap{position:relative;z-index:1;text-align:center;width:100%;max-width:340px}
.gglow{position:absolute;left:50%;top:0;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:radial-gradient(circle,rgba(155,224,122,.38),rgba(155,224,122,0) 68%);animation:gbreath 3.6s ease-in-out infinite}
@keyframes gbreath{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
.gtree{position:relative;width:min(52vw,210px);margin:0 auto 6px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
.gtree svg{width:100%;display:block}
.gt{font-size:36px;font-weight:800;margin:6px 0 2px;animation:gup .7s .35s cubic-bezier(.2,.9,.3,1.1) backwards}
.gs{color:var(--mute);margin:0 0 24px;font-size:15px;line-height:1.7;animation:gup .7s .5s cubic-bezier(.2,.9,.3,1.1) backwards}
@keyframes gup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f3a2c;font-weight:800;font-size:18px;padding:14px;border-radius:999px;box-shadow:0 6px 0 #c3d3c9;transition:transform .08s,box-shadow .08s,opacity .2s;animation:gup .7s .65s cubic-bezier(.2,.9,.3,1.1) backwards,gpulse 2.8s 1.6s ease-out infinite}
.gbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #c3d3c9}
.gbtn:disabled{opacity:.75;animation:none;cursor:default}
@keyframes gpulse{0%{box-shadow:0 6px 0 #c3d3c9,0 0 0 0 rgba(155,224,122,.55)}70%,100%{box-shadow:0 6px 0 #c3d3c9,0 0 0 16px rgba(155,224,122,0)}}
.gic{display:inline-flex}
.gspin{width:20px;height:20px;border:3px solid rgba(31,58,44,.2);border-top-color:#2e7d32;border-radius:50%;animation:gspin .8s linear infinite}
.gspin[hidden],.gic[hidden]{display:none}
@keyframes gspin{to{transform:rotate(360deg)}}
.gmsg{color:#ffd2cd;background:rgba(255,138,128,.16);border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.6;margin:14px 0 0;animation:gshake .45s}
.gmsg[hidden]{display:none}
@keyframes gshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.gskip{background:none;color:var(--mute);margin-top:14px;font-size:14px;text-decoration:underline;padding:8px 12px;animation:gup .7s .8s cubic-bezier(.2,.9,.3,1.1) backwards}
.gdots::after{content:'';animation:gdots 1.3s steps(1) infinite}
@keyframes gdots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#gate.ok .gbtn,#gate.ok .gskip,#gate.ok .gmsg{display:none}
#gate.ok .gtree{animation:gbloom .9s cubic-bezier(.2,.9,.3,1.25) both}
#gate.ok .gglow{animation:gburst 1s ease-out both}
@keyframes gbloom{0%{transform:scale(1)}55%{transform:scale(1.18)}100%{transform:scale(1.1)}}
@keyframes gburst{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){#gate *,#gate{animation:none!important}}
/* استجابة الشاشات (موبايل / تابلت / كمبيوتر / أفقي) */
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
.app{min-height:100vh;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
nav{padding-bottom:env(safe-area-inset-bottom)}
.toast,.banner{top:max(12px,env(safe-area-inset-top))}
#sheetBody{max-height:86vh;max-height:86dvh;padding-bottom:calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.row,.card,.setrow span,.muted{overflow-wrap:anywhere}
.setrow{flex-wrap:wrap}
select{max-width:100%}
.pager button{width:44px;height:44px}
.sm{min-height:40px}
.stage{width:clamp(150px,min(78vw,300px,100dvh - 340px),300px)}
@media (max-width:360px){.time{font-size:44px}.big{font-size:17px}nav button{font-size:11px;padding:9px 2px 11px}.chip{padding:7px 11px;font-size:13px}.hrow .n{width:64px}.shop{gap:8px}.tile b{font-size:21px}.card{padding:13px}}
@media (min-width:700px){.app{max-width:640px}nav .in{max-width:640px}#sheet{align-items:center}#sheetBody{max-width:560px;width:calc(100% - 32px);border-radius:24px;margin:16px}.shop{grid-template-columns:repeat(3,1fr)}.ach{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.app{max-width:720px}nav .in{max-width:720px}}
@media (max-height:480px) and (orientation:landscape){.time{font-size:38px;margin:0}.stage{margin-top:2px}.seg{margin:6px auto}.big{margin-top:8px;padding:10px}nav button{flex-direction:row;justify-content:center;gap:6px;padding:6px 4px}}
</style>
</head>

<div class="app">
  <header><h1>🌲 غابتي</h1><div style="display:flex;gap:8px;align-items:center"><button class="coin" id="acctBtn" data-act="acct" aria-label="حسابي" style="border:0;cursor:pointer;font:inherit;color:inherit">👤</button><div class="coin">🪙 <span id="coins">0</span></div></div></header>

<script>
/* ---------- helpers & state ---------- */
const $=s=>document.querySelector(s);

const KEY='forest-web-v1';

let S;
try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{window.fbPush&&window.fbPush()}catch(e){}};
const COLORS=['#e57373','#f2994a','#f2c94c','#6fcf97','#56ccf2','#9b8cf2','#bb6bd9','#b0b0b0'];
const SP={
 oak:{name:'بر الوالدين',price:0,kind:'round',trunk:'#7a5230',c1:'#43a047',c2:'#2e7d32'},
 pine:{name:'النهوض بالأمة',price:60,kind:'cone',trunk:'#6b4a2b',c1:'#2e8b57',c2:'#1f6a40'},
 cherry:{name:'مصدر رزق طيب',price:120,kind:'round',trunk:'#6e4a3a',c1:'#f7b1ca',c2:'#e88bb0',petals:1},

async function fetchBlob(u,onP){
 let last;
 for(let a=0;a<3;a++){
  for(const x of (u.startsWith('audio/')?[u,altUrl(u)]:[u])){
   const ac=new AbortController();let tm;const kick=()=>{clearTimeout(tm);tm=setTimeout(()=>ac.abort(),30000)};
   try{
    kick();const r=await fetch(x,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);
    const total=r.headers.get('content-encoding')?0:(+r.headers.get('content-length')||0);
    if(r.body&&r.body.getReader){
     const rd=r.body.getReader(),parts=[];let got=0;
     for(;;){const o=await rd.read();if(o.done)break;parts.push(o.value);got+=o.value.length;kick();onP&&onP(got,total)}
     clearTimeout(tm);if(total&&got<total)throw new Error('ملف ناقص');
     return new Blob(parts,{type:'audio/mpeg'});
    }
    const b=await r.blob();clearTimeout(tm);if(total&&b.size<total)throw new Error('ملف ناقص');return b;
   }catch(e){clearTimeout(tm);last=e;if(navigator.onLine===false)throw e}
  }
  await new Promise(r=>setTimeout(r,1500*(a+1)));
 }
 throw last;
}

const fbHash=t=>{let x=0;for(let i=0;i<t.length;i++)x=(x*31+t.charCodeAt(i))|0;return String(x)};

let fbP=null;

async function fbLoad0(){

let fbTry=0;

 await FB.FS.setDoc(fbDoc(),{data,mod});

 try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem('forest-fb-last',String(mod))}catch(e){}
 fbMsg='';acctRefresh()}
function fbPush(){

function fbAdopt(cd,cm){
 const keep={active:S.active,rest:S.rest,pnotified:S.pnotified,ppre:S.ppre,_uid:S._uid};
 try{localStorage.setItem('forest-fb-backup',JSON.stringify(S))}catch(e){}
 S=Object.assign(def(),cd,keep);S._sync=cm;S._ssig=fbHash(fbSig());
 try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem('forest-fb-last',String(cm))}catch(e){}
 toast('اتحدّثت بياناتك من الحساب ✔');setTimeout(()=>location.reload(),700)}
async function fbPull(manual){
 if(!FB||!fbUser||fbBusy)return;
 fbBusy=true;
 try{
  const snap=await fbT(FB.FS.getDoc(fbDoc()));
  if(!snap.exists()){fbReady=true;await fbPushNow();return}
  const c=snap.data();let cd;try{cd=JSON.parse(c.data)}catch(e){fbMsg='بيانات الحساب تالفة';acctRefresh();return}
  const cm=+c.mod||0,localChanged=fbHash(fbSig())!==S._ssig,synced=!!S._sync;

  if((S.active||S.rest)&&!manual){fbMsg='في جلسة شغالة، المزامنة هتتم بعد ما تخلص';acctRefresh();return}
  if(synced&&!localChanged){fbReady=true;fbAdopt(cd,cm);return}

function fbSignIn(){
