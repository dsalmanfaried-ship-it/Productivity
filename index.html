<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غابتي – تركيز وإنتاجية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f3a2d;--bg2:#154d3b;--card:#1b5a45;--card2:#216b52;--ink:#f4f1e4;--mute:#a9cdbb;--leaf:#9be07a;--gold:#ffd45e;--red:#ff8a80;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1f7a5a 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.app{max-width:560px;margin:0 auto;padding:14px 16px 96px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
.coin{background:rgba(0,0,0,.25);padding:6px 14px;border-radius:999px;font-weight:700;color:var(--gold);display:flex;gap:6px;align-items:center}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,38,30,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;padding:10px 4px 12px;color:var(--mute);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--leaf)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.muted{color:var(--mute);font-size:13px}
/* focus */
.stage{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:10px auto 0}
.stage svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.12);stroke-width:5}
#ringP{fill:none;stroke:var(--leaf);stroke-width:5;stroke-linecap:round;stroke-dasharray:578;stroke-dashoffset:578;transition:stroke-dashoffset 1s linear}
.treebox{position:absolute;inset:12% 12% 8%}
.treebox svg{width:100%;height:100%}
.time{font-size:54px;font-weight:800;text-align:center;margin:6px 0 0;font-variant-numeric:tabular-nums;letter-spacing:1px}
.sub{text-align:center;color:var(--mute);min-height:22px;font-size:14px}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:4px;margin:12px auto;max-width:300px}
.seg button{flex:1;background:none;padding:7px 8px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--leaf);color:#12351f}
input[type=range]{width:100%;accent-color:var(--leaf);margin:6px 0}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.chip{background:rgba(0,0,0,.25);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.big{display:block;width:min(100%,300px);margin:14px auto 0;background:var(--leaf);color:#12351f;font-weight:800;font-size:19px;padding:14px;border-radius:999px;box-shadow:0 6px 0 #5da545;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #5da545}
.big.ghost{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;font-size:15px;padding:10px;margin-top:12px}
.warn{background:rgba(255,138,128,.14);color:#ffd2cd;border-radius:14px;padding:10px 14px;font-size:13px;text-align:center;margin:12px 0 0}
/* forest */
.grass{background:linear-gradient(#2a8a6a22,#1d5b45);border-radius:20px;padding:14px;min-height:200px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--s,62px),1fr));gap:6px}
.t{background:none;padding:0;position:relative;text-align:center}
.t svg{width:100%;height:auto;display:block}
.t i{position:absolute;bottom:2px;left:50%;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);border:1.5px solid rgba(0,0,0,.3)}
.pager{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.pager button{background:rgba(0,0,0,.25);width:38px;height:38px;border-radius:50%;font-size:18px}
.pager button:disabled{opacity:.3}
.pager b{font-size:15px}
.empty{text-align:center;color:var(--mute);padding:36px 10px;font-size:14px}
.detail{min-height:22px;text-align:center;font-size:13px;color:var(--mute);margin-top:10px}
/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:rgba(0,0,0,.2);border-radius:16px;padding:12px;text-align:center}
.tile b{display:block;font-size:24px;font-weight:800}
.tile span{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute)}
.bar div{width:100%;background:var(--leaf);border-radius:8px 8px 3px 3px;min-height:3px}
.bar em{font-style:normal;color:var(--ink);font-size:11px;min-height:14px}
.hrow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.hrow .n{width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .b{flex:1;height:12px;background:rgba(0,0,0,.25);border-radius:6px;overflow:hidden}
.hrow .b div{height:100%;border-radius:6px}
.hrow .v{width:62px;text-align:left;color:var(--mute);font-size:12px}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.a{background:rgba(0,0,0,.2);border-radius:14px;padding:10px;font-size:13px;opacity:.45}
.a.on{opacity:1;background:rgba(155,224,122,.15)}
.a b{display:block}
/* shop */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sp{background:var(--card2);border-radius:18px;padding:10px;text-align:center;border:2px solid transparent}
.sp.sel{border-color:var(--leaf)}
.sp svg{width:100%;height:110px}
.sp b{display:block;margin:2px 0 8px}
.sp button{width:100%;padding:8px;border-radius:999px;font-weight:700;background:var(--leaf);color:#12351f;font-size:14px}
.sp button.buy{background:var(--gold)}
.sp button.no{background:rgba(0,0,0,.3);color:var(--mute)}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on{display:flex}
#sheetBody{background:#143f31;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px 28px;max-height:86vh;overflow:auto;border:1px solid var(--line)}
#sheet.center{align-items:center}
#sheet.center #sheetBody{border-radius:24px;margin:16px;text-align:center}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(0,0,0,.2);margin-bottom:8px;width:100%;text-align:right;font-weight:600}
.row.sel{outline:2px solid var(--leaf)}
.row .x{margin-right:auto;background:none;color:var(--red);font-size:18px}
input[type=text]{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;margin:8px 0}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:#fff}
.banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94vw,520px);background:#fff;color:#12351f;border-radius:20px;padding:14px 16px 12px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.45);border-right:6px solid #5da545}
.banner b{display:block;font-size:17px;margin-bottom:4px}
.banner p{margin:4px 0;font-size:14px;line-height:1.7}
.banner .tip{color:#2f6a3a;background:#eef8e8;border-radius:10px;padding:6px 10px}
.banner small{color:#5a6b5f}
.banner .bx{position:absolute;left:10px;top:8px;background:none;color:#12351f;font-size:18px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#12351f;padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:14px;max-width:90vw;text-align:center}
select{background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit}
.setrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:10px;font-size:14px}
.sm{background:rgba(255,255,255,.1);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
.sm.red{background:rgba(255,138,128,.2);color:#ffd2cd}
.big-t{width:150px;margin:0 auto}
.big-t svg{width:100%}
.tg{transform-origin:100px 172px;transition:transform 1.05s linear}
.sw{transform-origin:100px 172px}
.treebox .sw,.big-t .sw{animation:sway 4.5s ease-in-out infinite}
.sd{transform-origin:100px 172px;animation:sprout .9s ease-out both,sway 3s ease-in-out .9s infinite}
.treebox svg{animation:pop .5s cubic-bezier(.2,1.3,.4,1) both}
.big-t svg{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
#sheetBody{animation:up .28s ease-out}
.banner,.toast{animation:drop .3s ease-out}
.t:hover svg,.sp:hover svg{transform:scale(1.08)}
.t svg,.sp svg{transition:transform .2s}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes sprout{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><h1>🌲 غابتي</h1><div class="coin">🪙 <span id="coins">0</span></div></header>
  <main id="main"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<div id="sheet"><div id="sheetBody"></div></div>
<div id="toast"></div>

<script>
/* ---------- helpers & state ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='forest-web-v1';
const def=()=>({sessions:[],tags:[{id:'t1',name:'دراسة',color:'#56ccf2'},{id:'t2',name:'شغل',color:'#f2994a'},{id:'t3',name:'قراءة',color:'#bb6bd9'},{id:'t4',name:'رياضة',color:'#6fcf97'}],coins:0,unlocked:['oak'],species:'oak',dur:25,mode:'down',tag:'t1',sound:'none',grace:10,active:null,qr:'islam',qpos:{},pray:{city:'cairo',method:'egypt',auto:'pause',lat:30.0444,lng:31.2357},pnotified:'',ppre:''});
let S;
try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const COLORS=['#e57373','#f2994a','#f2c94c','#6fcf97','#56ccf2','#9b8cf2','#bb6bd9','#b0b0b0'];
const SP={
 oak:{name:'بر الوالدين',price:0,kind:'round',trunk:'#7a5230',c1:'#43a047',c2:'#2e7d32'},
 pine:{name:'النهوض بالأمة',price:60,kind:'cone',trunk:'#6b4a2b',c1:'#2e8b57',c2:'#1f6a40'},
 cherry:{name:'مصدر رزق طيب',price:120,kind:'round',trunk:'#6e4a3a',c1:'#f7b1ca',c2:'#e88bb0',petals:1},
 palm:{name:'زواج مبكر',price:200,kind:'palm',trunk:'#a07a45',c1:'#4caf50',c2:'#2e8b3a'},
 cactus:{name:'عفّة',price:300,kind:'cactus',trunk:'#4f9d5d',c1:'#58a866',c2:'#3b7f49'},
 bamboo:{name:'تحسين صورة المسلم',price:450,kind:'bamboo',trunk:'#9ccc4f',c1:'#6aa832',c2:'#4d8a22'}
};
S.unlocked=S.unlocked.filter(k=>SP[k]);if(!S.unlocked.includes('oak'))S.unlocked.push('oak');
if(!SP[S.species])S.species='oak';
S.sessions.forEach(x=>{if(!SP[x.species])x.species='oak'});
let tab='focus',period='week',off=0,newColor=COLORS[4],tickT=null,killT=null,pauseT=null,lastSec=-1;

/* ---------- tree drawing ---------- */
function shape(s,tr,c1,c2,dead){
 const k=s.kind;
 if(k==='round'){
  let o=`<rect x="93" y="100" width="14" height="72" rx="4" fill="${tr}"/>`;
  if(dead) return o+`<path d="M100 122 L70 92 M100 112 L130 86 M100 100 L100 66" stroke="${tr}" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="70" cy="92" r="5" fill="${c2}"/><circle cx="130" cy="86" r="5" fill="${c2}"/>`;
  o+=`<circle cx="72" cy="104" r="28" fill="${c2}"/><circle cx="128" cy="104" r="28" fill="${c2}"/><circle cx="100" cy="82" r="40" fill="${c1}"/><circle cx="82" cy="64" r="21" fill="${c1}"/><circle cx="118" cy="62" r="20" fill="${c1}"/><circle cx="88" cy="72" r="11" fill="#fff" opacity=".12"/>`;
  if(s.petals) o+=[[78,84],[118,76],[100,58],[134,104],[66,108],[100,100]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" opacity=".85"/>`).join('');
  return o;
 }
 if(k==='cone') return `<rect x="95" y="140" width="10" height="32" rx="3" fill="${tr}"/><polygon points="100,95 44,152 156,152" fill="${c1}"/><polygon points="100,66 52,126 148,126" fill="${c2}"/><polygon points="100,34 60,96 140,96" fill="${c1}"/>`;
 if(k==='palm'){
  let o=`<path d="M97 172 Q108 122 100 72" stroke="${tr}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  o+=[-85,-55,-25,25,55,85].map(a=>`<path d="M100 70 Q88 40 100 14 Q112 40 100 70Z" fill="${Math.abs(a)>60?c2:c1}" transform="rotate(${a} 100 70)"/>`).join('');
  return o+`<circle cx="94" cy="76" r="5" fill="#6b4a2b"/><circle cx="106" cy="78" r="5" fill="#6b4a2b"/>`;
 }
 if(k==='cactus') return `<rect x="62" y="100" width="14" height="40" rx="7" fill="${c2}"/><rect x="62" y="126" width="34" height="14" rx="7" fill="${c2}"/><rect x="124" y="82" width="14" height="38" rx="7" fill="${c2}"/><rect x="104" y="106" width="34" height="14" rx="7" fill="${c2}"/><rect x="86" y="58" width="28" height="114" rx="14" fill="${c1}"/><path d="M100 62 V170" stroke="${c2}" stroke-width="2" opacity=".6"/><circle cx="100" cy="56" r="7" fill="${dead?'#a59a80':'#ff7fa8'}"/>`;
 if(k==='bamboo'){
  const st=[[78,110],[100,138],[122,96]];
  let o='';
  st.forEach(a=>{const x=a[0],h=a[1];o+=`<rect x="${x-5}" y="${172-h}" width="10" height="${h}" rx="4" fill="${tr}"/>`;
   for(let y=172-h+18;y<168;y+=26) o+=`<rect x="${x-6}" y="${y}" width="12" height="3" rx="1.5" fill="${c2}"/>`;
   o+=`<ellipse cx="${x+14}" cy="${172-h+20}" rx="13" ry="5" fill="${c1}" transform="rotate(-25 ${x+14} ${172-h+20})"/><ellipse cx="${x-14}" cy="${172-h+40}" rx="13" ry="5" fill="${c2}" transform="rotate(25 ${x-14} ${172-h+40})"/>`});
  return o;
 }
 return '';
}
function treeSVG(key,p,dead,vb){
 const s=SP[key]||SP.oak;
 let tr=s.trunk,c1=s.c1,c2=s.c2;
 if(dead){tr='#6b5a47';c1='#a59a80';c2='#8a7f66'}
 const ground=`<ellipse cx="100" cy="175" rx="60" ry="10" fill="${dead?'#7b6b52':'#7a5a37'}"/><ellipse cx="100" cy="172" rx="54" ry="7" fill="${dead?'#8f8264':'#5fa84f'}"/>`;
 let body;
 if(p<0.1&&!dead) body=`<g class="sd"><path d="M100 172 L100 150" stroke="#5fb760" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="89" cy="148" rx="11" ry="6" fill="#6fcf6f" transform="rotate(-25 89 148)"/><ellipse cx="111" cy="146" rx="11" ry="6" fill="#58b85a" transform="rotate(25 111 146)"/></g>`;
 else{
  const k=0.3+0.7*Math.max(p,dead?0.3:0.1);
  body=`<g class="tg" style="transform:${dead?'rotate(6deg) ':''}scale(${k.toFixed(3)})"><g class="${dead?'':'sw'}">${shape(s,tr,c1,c2,dead)}</g></g>`;
 }
 return `<svg viewBox="${vb||'0 0 200 190'}" xmlns="http://www.w3.org/2000/svg">${ground}${body}</svg>`;
}

/* ---------- time helpers ---------- */
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
const fmtMin=m=>m>=60?Math.floor(m/60)+' س '+(m%60?m%60+' د':''):m+' د';
const tagOf=id=>S.tags.find(t=>t.id===id)||{name:'بدون تاج',color:'#8d8d8d'};
const okS=()=>S.sessions.filter(x=>x.ok);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2800)}

/* ---------- sound ---------- */
let AC=null,SN=null;
/* ---------- Quran audio (user-supplied files) ---------- */
const RN={islam:'إسلام عثمان',kasab:'أحمد كاسب'};
const au=new Audio();au.preload='auto';
const Q={files:[],db:null};let qi=0,qList=[],qOn=false;
function qSort(){Q.files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))}
function qOpen(){return new Promise(res=>{try{const r=indexedDB.open('forest-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>{Q.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})}
function qLoad(){return qOpen().then(ok=>new Promise(res=>{if(!ok)return res();try{const r=Q.db.transaction('f','readonly').objectStore('f').getAll();r.onsuccess=()=>{Q.files=r.result.map(f=>({...f,url:URL.createObjectURL(f.blob)}));qSort();res()};r.onerror=()=>res()}catch(e){res()}}))}
function qAdd(r,list){[...list].forEach((f,i)=>{const rec={id:r+'-'+Date.now()+'-'+i,reciter:r,name:f.name,blob:f};Q.files.push({...rec,url:URL.createObjectURL(f)});try{Q.db&&Q.db.transaction('f','readwrite').objectStore('f').put(rec)}catch(e){}});qSort();return Promise.resolve()}
function qDel(id){const f=Q.files.find(x=>x.id===id);if(f)URL.revokeObjectURL(f.url);Q.files=Q.files.filter(x=>x.id!==id);try{Q.db&&Q.db.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}
function qFiles(){return S.qr==='both'?[...Q.files.filter(f=>f.reciter==='islam'),...Q.files.filter(f=>f.reciter==='kasab')]:Q.files.filter(f=>f.reciter===S.qr)}
function qPlay(t){au.src=qList[qi].url;au.addEventListener('loadedmetadata',()=>{if(t){try{au.currentTime=t}catch(e){}}au.play().catch(()=>{})},{once:true});au.load()}
function qStart(){
 qList=qFiles();
 if(!qList.length){toast('ارفع ملفات التلاوة الأول من إعدادات الصوت 📖');return false}
 const pos=(S.qpos&&S.qpos[S.qr])||{idx:0,t:0};qi=Math.min(pos.idx||0,qList.length-1);qOn=true;qPlay(pos.t||0);return true;
}
au.onended=()=>{if(!qOn)return;qi=(qi+1)%qList.length;qPlay(0)};
function qSave(){if(!qOn)return;S.qpos=S.qpos||{};S.qpos[S.qr]={idx:qi,t:au.currentTime||0}}
function qStop(){if(qOn){qSave();qOn=false;save()}au.pause()}
const qReady=qLoad();

function startSound(kind){
 stopSound();if(kind==='none')return;if(kind==='quran'){qStart();return}
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();
  const n=AC.sampleRate*2,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;if(kind==='rain')d[i]=w;else{last=(last+0.02*w)/1.02;d[i]=last*3.5}}

/* resume after refresh if within grace, otherwise the tree dies */
if(S.active){
 const A0=S.active;
 const alive=A0.pausedAt?(Date.now()-A0.pausedAt<=30*60000):(Date.now()-A0.lastSeen<=S.grace*1000+1500);
 if(alive){beginTick();if(A0.pausedAt)pauseT=setTimeout(()=>{if(S.active&&S.active.pausedAt)finish(false)},Math.max(1000,30*60000-(Date.now()-A0.pausedAt)));else qReady.then(()=>startSound(S.sound))}
 else{const a=S.active;const el=(a.lastSeen||a.start)-a.start;S.sessions.push({id:'s'+a.start,start:a.start,end:Date.now(),mins:Math.floor(el/60000),tag:a.tag,species:a.species,ok:false,p:progress(a,el)});S.active=null;save()}
}

/* ---------- sheet ---------- */
function sheet(html,center){$('#sheet').className='on'+(center?' center':'');$('#sheetBody').innerHTML=html}
function closeSheet(){$('#sheet').className=''}

/* ---------- views ---------- */
function vFocus(){
 const a=S.active;
 if(a){
  const el=(a.pausedAt||Date.now())-a.start,p=progress(a,el),remain=a.mode==='down'?a.dur-el:el;
  return `<div class="stage"><svg class="ring" viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="92"/><circle id="ringP" cx="100" cy="100" r="92" style="stroke-dashoffset:${578*(1-p)}"/></svg><div class="treebox" id="treeBox">${treeSVG(a.species,p,false)}</div></div>
  <div class="time" id="tm">${fmt(remain)}</div>
  <div class="sub"><span class="dot" style="background:${tagOf(a.tag).color}"></span> ${esc(tagOf(a.tag).name)}</div>
  <div class="muted" id="np" style="text-align:center;margin-top:4px"></div>
 <div id="bn" style="text-align:center;color:var(--gold);font-size:13px;font-weight:700;min-height:18px"></div>
  ${a.pausedAt?'<div class="warn" style="background:rgba(155,224,122,.15);color:var(--leaf)">🕌 الجلسة واقفة للصلاة. صلّي وارجع دوس استئناف (الحد الأقصى ٣٠ دقيقة).</div><button class="big" data-act="resume">استئناف ▶</button>':`<div class="warn">⚠️ متسيبش التاب ده! لو خرجت أكتر من ${S.grace} ثانية الشجرة هتموت.</div>
  ${a.mode==='up'?'<button class="big" data-act="stop">خلصت ✔</button>':''}
  <button class="big ghost" data-act="pause" style="margin-top:12px">🕌 بريك للصلاة</button>`}
  <button class="big ghost" data-act="giveup">استسلم 🥀</button>`;
 }
 const mins=S.dur;
 const sndN={none:'بدون صوت',rain:'مطر 🌧️',forest:'غابة 🐦',quran:'سورة البقرة 📖'}[S.sound];
 return `<div class="stage"><svg class="ring" viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="92"/></svg><div class="treebox" id="treeBox">${treeSVG(S.species,1,false)}</div></div>
 <div class="time" id="tm">${S.mode==='down'?fmt(mins*60000):'00:00'}</div>
 <div class="sub">${S.mode==='down'?'اختار مدة التركيز':'العدّاد هيعدّ لحد ما تخلص'}</div>
 <div class="muted" id="np" style="text-align:center;margin-top:4px"></div>
 <div id="bn" style="text-align:center;color:var(--gold);font-size:13px;font-weight:700;min-height:18px"></div>
 <div class="seg"><button data-act="mode" data-v="down" class="${S.mode==='down'?'on':''}">⏳ مؤقت</button><button data-act="mode" data-v="up" class="${S.mode==='up'?'on':''}">⏱️ ستوب ووتش</button></div>
 ${S.mode==='down'?`<div style="max-width:320px;margin:0 auto">${S.autoDur?'<div class="muted" id="autoTxt" style="text-align:center;margin:8px 0"></div>':`<input type="range" id="dur" min="5" max="180" step="5" value="${S.dur}">`}</div>`:''}
 <div class="chips">
  ${S.mode==='down'?`<button class="chip" data-act="auto" style="${S.autoDur?'outline:2px solid var(--leaf)':''}">⏱ لحد الصلاة −٥د ${S.autoDur?'✔':''}</button>`:''}
  <button class="chip" data-act="tagSheet"><span class="dot" style="background:${tagOf(S.tag).color}"></span>${esc(tagOf(S.tag).name)}</button>
  <button class="chip" data-act="spSheet">🌳 ${SP[S.species].name}</button>
  <button class="chip" data-act="sndSheet">${sndN}</button>
 </div>
 <button class="big" data-act="plant">ازرع 🌱</button>`;
}
function rangeOf(kind,o){
 const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate();let s,e;
 if(kind==='day'){s=new Date(y,m,d+o);e=new Date(y,m,d+o+1)}
 else if(kind==='week'){s=new Date(y,m,d-((n.getDay()+1)%7)+o*7);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7)}
 else if(kind==='month'){s=new Date(y,m+o,1);e=new Date(y,m+o+1,1)}
 else{s=new Date(y+o,0,1);e=new Date(y+o+1,0,1)}
 return[s,e];
}
function vForest(){
 const[s,e]=rangeOf(period,off);
 const list=S.sessions.filter(x=>x.start>=s.getTime()&&x.start<e.getTime()).sort((a,b)=>a.start-b.start);
 const ok=list.filter(x=>x.ok),dead=list.length-ok.length,tot=ok.reduce((a,b)=>a+b.mins,0);
 const L=(d,o)=>d.toLocaleDateString('ar-EG',o);
 let label;
 if(period==='day')label=L(s,{weekday:'long',day:'numeric',month:'long'});
 else if(period==='week')label=L(s,{day:'numeric',month:'short'})+' – '+L(new Date(e-1),{day:'numeric',month:'short'});
 else if(period==='month')label=L(s,{month:'long',year:'numeric'});
 else label=L(s,{year:'numeric'});
 const size=period==='year'?'44px':period==='month'?'52px':'64px';
 return `<div class="seg" style="max-width:100%">${[['day','يوم'],['week','أسبوع'],['month','شهر'],['year','سنة']].map(p=>`<button data-act="per" data-v="${p[0]}" class="${period===p[0]?'on':''}">${p[1]}</button>`).join('')}</div>
 <div class="pager"><button data-act="nav" data-v="-1">›</button><b>${label}</b><button data-act="nav" data-v="1" ${off>=0?'disabled':''}>‹</button></div>
 <div class="muted" style="text-align:center;margin-bottom:10px">🌳 ${ok.length} &nbsp; 🥀 ${dead} &nbsp; ⏱ ${fmtMin(tot)}</div>
 <div class="grass">${list.length?`<div class="grid" style="--s:${size}">${list.map(x=>`<button class="t" data-act="detail" data-v="${x.id}">${treeSVG(x.species,x.p,!x.ok,'30 25 140 160')}<i style="background:${tagOf(x.tag).color}"></i></button>`).join('')}</div>`:'<div class="empty">الغابة فاضية في الفترة دي 🌱<br>ابدأ جلسة تركيز وازرع أول شجرة</div>'}</div>
 <div class="detail" id="detail">دوس على شجرة عشان تشوف تفاصيلها</div>`;
}
function streak(){
 const days=new Set(okS().map(x=>dayKey(x.start)));let c=0;const d=new Date();
 if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);
 while(days.has(dayKey(d))){c++;d.setDate(d.getDate()-1)}
 return c;
}
function vStats(){
 const ok=okS(),total=ok.reduce((a,b)=>a+b.mins,0),dead=S.sessions.length-ok.length;
 const now=new Date(),td=dayKey(now);
 const today=ok.filter(x=>dayKey(x.start)===td).reduce((a,b)=>a+b.mins,0);
 const wk=rangeOf('week',0),week=ok.filter(x=>x.start>=wk[0].getTime()).reduce((a,b)=>a+b.mins,0);
 const days=[];for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const k=dayKey(d);days.push({l:d.toLocaleDateString('ar-EG',{weekday:'short'}),m:ok.filter(x=>dayKey(x.start)===k).reduce((a,b)=>a+b.mins,0)})}
 const mx=Math.max(30,...days.map(d=>d.m));
 const byTag={};ok.forEach(x=>byTag[x.tag]=(byTag[x.tag]||0)+x.mins);
 const tg=Object.entries(byTag).sort((a,b)=>b[1]-a[1]);
 const st=streak();
 const A=[['🌱 أول شجرة','ازرع أول شجرة',ok.length>=1],['🌳 غابة صغيرة','١٠ أشجار',ok.length>=10],['🏞️ غابة كبيرة','١٠٠ شجرة',ok.length>=100],['🔥 ٣ أيام ورا بعض','سلسلة ٣ أيام',st>=3],['🔥 أسبوع كامل','سلسلة ٧ أيام',st>=7],['⏱ ١٠ ساعات','١٠ ساعات تركيز',total>=600],['💪 جلسة ساعة','جلسة ٦٠ دقيقة أو أكتر',ok.some(x=>x.mins>=60)],['🌴 جامع أشجار','افتح ٤ أنواع',S.unlocked.length>=4]];
 return `<div class="card"><div class="tiles">
  <div class="tile"><b>${fmtMin(today)||'0 د'}</b><span>النهارده</span></div>
  <div class="tile"><b>${fmtMin(week)}</b><span>الأسبوع ده</span></div>
  <div class="tile"><b>${ok.length}</b><span>أشجار نجحت</span></div>
  <div class="tile"><b>${dead}</b><span>أشجار ماتت</span></div>
  <div class="tile"><b>${fmtMin(total)}</b><span>إجمالي التركيز</span></div>
  <div class="tile"><b>${st} 🔥</b><span>أيام متتالية</span></div></div></div>
 <div class="card"><h2>آخر ٧ أيام (بالدقايق)</h2><div class="bars">${days.map(d=>`<div class="bar"><em>${d.m||''}</em><div style="height:${Math.round(d.m/mx*100)}%"></div>${d.l}</div>`).join('')}</div></div>
 <div class="card"><h2>التركيز حسب التاج</h2>${tg.length?tg.map(t=>`<div class="hrow"><span class="dot" style="background:${tagOf(t[0]).color}"></span><span class="n">${esc(tagOf(t[0]).name)}</span><div class="b"><div style="width:${t[1]/tg[0][1]*100}%;background:${tagOf(t[0]).color}"></div></div><span class="v">${fmtMin(t[1])}</span></div>`).join(''):'<div class="muted">لسه مفيش بيانات</div>'}</div>
 <div class="card"><h2>إنجازات</h2><div class="ach">${A.map(a=>`<div class="a ${a[2]?'on':''}"><b>${a[0]}</b>${a[1]}</div>`).join('')}</div></div>
 <div class="card"><h2>الإعدادات</h2>
  <div class="setrow"><span>مهلة الخروج من التاب</span><select id="grace">${[5,10,30,60].map(g=>`<option value="${g}" ${S.grace===g?'selected':''}>${g} ثانية</option>`).join('')}</select></div>
  <div class="setrow"><span>نسخ بياناتك احتياطي</span><button class="sm" data-act="export">نسخ</button></div>
  <div class="setrow"><span>مسح كل البيانات</span><button class="sm red" data-act="reset">مسح</button></div>
 </div>`;
}
function vShop(){
 return `<div class="card" style="text-align:center"><div class="muted">رصيدك</div><div style="font-size:30px;font-weight:800;color:var(--gold)">🪙 ${S.coins}</div><div class="muted">كل دقيقة تركيز بتديك عملة (×2 في الصبح ☀️)</div></div>
 <div class="shop">${Object.entries(SP).map(([k,s])=>{
  const un=S.unlocked.includes(k),sel=S.species===k;
  const btn=un?(sel?'<button class="no" disabled>مختارة ✔</button>':`<button data-act="pick" data-v="${k}">اختار</button>`):(S.coins>=s.price?`<button class="buy" data-act="buy" data-v="${k}">شراء 🪙 ${s.price}</button>`:`<button class="no" disabled>🔒 ${s.price} 🪙</button>`);
  return `<div class="sp ${sel?'sel':''}">${treeSVG(k,1,false,'20 20 160 165')}<b>${s.name}</b>${btn}</div>`}).join('')}</div>`;
}
function render(){
 $('#coins').textContent=S.coins;
 $('#nav').innerHTML=[['focus','🌱','تركيز'],['forest','🌳','الغابة'],['pray','🕌','الصلاة'],['stats','📊','إحصائيات'],['shop','🛒','المتجر']].map(t=>`<button data-act="tab" data-v="${t[0]}" class="${tab===t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $('#main').innerHTML=tab==='focus'?vFocus():tab==='forest'?vForest():tab==='pray'?vPray():tab==='stats'?vStats():vShop();
 const d=$('#dur');if(d)d.oninput=()=>{S.dur=+d.value;$('#tm').textContent=fmt(S.dur*60000);save()};
 const g=$('#grace');if(g)g.onchange=()=>{S.grace=+g.value;save()};
 const bind=(id,fn)=>{const e=$('#'+id);if(e)e.onchange=()=>{fn(e.value);save();render()}};
 bind('pcity',v=>S.pray.city=v);bind('pmeth',v=>S.pray.method=v);bind('pauto',v=>S.pray.auto=v);bind('pduha',v=>S.pray.duha=v==='1');bind('ppre',v=>S.pray.pre=+v);bind('plat',v=>S.pray.lat=parseFloat(v)||0);bind('plng',v=>S.pray.lng=parseFloat(v)||0);
 updateNp();
}

/* ---------- sheets ---------- */
function tagSheet(){
 sheet(`<h2>اختار تاج</h2>${S.tags.map(t=>`<div class="row ${t.id===S.tag?'sel':''}" data-act="pickTag" data-v="${t.id}"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}<button class="x" data-act="delTag" data-v="${t.id}">✕</button></div>`).join('')}
 <h2 style="margin-top:14px">تاج جديد</h2><input type="text" id="tagName" maxlength="20" placeholder="اسم التاج">
 <div class="sw">${COLORS.map(c=>`<button data-act="color" data-v="${c}" class="${c===newColor?'on':''}" style="background:${c}"></button>`).join('')}</div>
 <button class="big" data-act="addTag" style="margin-top:0">إضافة</button>`);
}
function spSheet(){
 sheet(`<h2>اختار نيّة الشجرة</h2>${S.unlocked.map(k=>`<div class="row ${k===S.species?'sel':''}" data-act="pick" data-v="${k}"><span style="width:44px">${treeSVG(k,1,false,'30 25 140 160')}</span>${SP[k].name}</div>`).join('')}<div class="muted">افتح أنواع تانية من المتجر 🛒</div>`);
}
function quranSheet(){
 const sec=r=>{const fl=Q.files.filter(f=>f.reciter===r);return `<div class="card" style="background:rgba(0,0,0,.2)"><h2>${RN[r]}</h2>${fl.map(f=>`<div class="row" style="cursor:default"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left;flex:1">${esc(f.name)}</span><button class="x" data-act="qdel" data-v="${f.id}">✕</button></div>`).join('')||'<div class="muted">لسه مفيش ملفات</div>'}<label class="sm" style="display:inline-block;margin-top:8px;cursor:pointer">＋ رفع تلاوة<input type="file" accept="audio/*" multiple hidden data-r="${r}"></label></div>`};
 sheet(`<h2>سورة البقرة 📖</h2><p class="muted">ارفع ملفات التلاوة اللي عندك. لو السورة مقسمة أجزاء ارفعها كلها وهتشتغل بالترتيب حسب اسم الملف، وبتكمّل من آخر مكان وقفت فيه. الملفات بتفضل على جهازك بس.</p>
 ${['islam','kasab'].map(sec).join('')}
 <h2>القارئ اللي يشتغل</h2>${[['islam','إسلام عثمان'],['kasab','أحمد كاسب'],['both','الاتنين بالترتيب']].map(r=>`<div class="row ${S.qr===r[0]?'sel':''}" data-act="qr" data-v="${r[0]}">${r[1]}</div>`).join('')}
 <button class="big" data-act="qok">تمام</button>`);
 document.querySelectorAll('#sheetBody input[type=file]').forEach(i=>i.onchange=()=>{qAdd(i.dataset.r,i.files).then(quranSheet)});
}
function sndSheet(){
 sheet(`<h2>صوت الخلفية</h2>${[['none','بدون صوت'],['quran','سورة البقرة 📖'],['rain','مطر 🌧️'],['forest','غابة وعصافير 🐦']].map(s=>`<div class="row ${S.sound===s[0]?'sel':''}" data-act="snd" data-v="${s[0]}">${s[1]}</div>`).join('')}<div class="row" data-act="quranSheet">⚙️ التلاوات والقارئ (${RN[S.qr]||'الاتنين'})</div>`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 if(e.target.id==='sheet'&&!$('#sheet').classList.contains('center')){closeSheet();return}
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.classList.contains('x')===false&&e.target.closest('.x'))return;
 const a=el.dataset.act,v=el.dataset.v;
 switch(a){
  case 'tab':tab=v;off=0;render();break;
  case 'mode':S.mode=v;save();render();break;
  case 'plant':startRun();break;
  case 'testNotif':{const k=pNext().k;chime(true);notify('تجربة تنبيه '+PN[k],FADL[k].t);banner('حان وقت صلاة '+PN[k]+' 🕌 (تجربة)',FADL[k].f||FADL[k].t,FADL[k].s,tabkirTip(k))}break;
  case 'auto':S.autoDur=!S.autoDur;save();render();break;
  case 'pause':pauseRun();closeSheet();break;
  case 'resume':resumeRun();closeSheet();break;
  case 'notif':try{Notification.requestPermission().then(r=>toast(r==='granted'?'اتفعّلت ✔':'المتصفح مسمحش بالإشعارات'),()=>toast('الإشعارات مش متاحة هنا'))}catch(err){toast('الإشعارات مش متاحة هنا')}break;
  case 'giveup':sheet(`<h2 style="font-size:19px">متأكد إنك عايز تستسلم؟</h2><p class="muted">الشجرة هتموت 🥀</p><button class="big" data-act="close">كمّل تركيز 💪</button><button class="big ghost" data-act="giveupYes">أيوه، استسلم</button>`,true);break;
  case 'giveupYes':closeSheet();finish(false);break;
  case 'stop':finish(true);break;
  case 'close':closeSheet();break;
  case 'tagSheet':tagSheet();break;
  case 'pickTag':S.tag=v;save();closeSheet();render();break;
  case 'delTag':if(S.tags.length>1){S.tags=S.tags.filter(t=>t.id!==v);if(S.tag===v)S.tag=S.tags[0].id;save();tagSheet()}else toast('لازم يفضل تاج واحد على الأقل');break;
  case 'color':newColor=v;{const n=$('#tagName').value;tagSheet();$('#tagName').value=n}break;
  case 'addTag':{const n=$('#tagName').value.trim();if(!n){toast('اكتب اسم التاج');break}const id='t'+Date.now();S.tags.push({id,name:n,color:newColor});S.tag=id;save();closeSheet();render()}break;
  case 'spSheet':spSheet();break;
  case 'pick':S.species=v;save();closeSheet();render();break;
  case 'sndSheet':sndSheet();break;
  case 'snd':S.sound=v;save();if(v==='quran'&&!qFiles().length)quranSheet();else{closeSheet();render()}break;
  case 'quranSheet':quranSheet();break;
  case 'qdel':qDel(v);quranSheet();break;
  case 'qr':S.qr=v;save();quranSheet();break;
  case 'qok':closeSheet();render();break;
  case 'buy':{const s=SP[v];if(S.coins>=s.price&&!S.unlocked.includes(v)){S.coins-=s.price;S.unlocked.push(v);S.species=v;save();render();toast('مبروك! فتحت '+s.name+' 🎉')}}break;
  case 'per':period=v;off=0;render();break;
  case 'nav':off=Math.min(0,off+ +v);render();break;
  case 'detail':{const x=S.sessions.find(s=>s.id===v);if(x){const d=new Date(x.start).toLocaleString('ar-EG',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});$('#detail').innerHTML=`${x.ok?'🌳':'🥀'} ${(SP[x.species]||SP.oak).name} • ${esc(tagOf(x.tag).name)} • ${fmtMin(x.mins)||'أقل من دقيقة'} • ${d}`}}break;
  case 'export':{const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>toast('اتنسخت ✔'),()=>toast('مش قادر أنسخ'))}catch(err){toast('مش قادر أنسخ')}}break;
  case 'reset':sheet(`<h2 style="font-size:19px">مسح كل البيانات؟</h2><p class="muted">الغابة والعملات هتتمسح نهائي.</p><button class="big" data-act="close">لأ، سيبها</button><button class="big ghost" data-act="resetYes">أيوه امسح</button>`,true);break;
  case 'resetYes':{const g=S.grace;S=def();S.grace=g;save();closeSheet();render()}break;
 }
});
setInterval(prayerWatch,1000);
render();
</script>
</body>
